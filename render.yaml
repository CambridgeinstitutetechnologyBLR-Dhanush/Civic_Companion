services:
  - type: web
    name: civic-companion-api
    env: python
    buildCommand: "cd server && pip install -r requirements.txt"
    startCommand: "cd server && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
